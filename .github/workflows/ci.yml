name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: pip install --require-hashes -r server/requirements-test.txt
      - run: python -m pytest
      - run: pip install pip-audit && pip-audit -r server/requirements.txt
      - run: docker build -t slate:test .
      - name: Container smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/vault"
          docker run -d --name slate-test -p 5147:5147 -v "$RUNNER_TEMP/vault:/vault" slate:test
          trap 'docker logs slate-test; docker rm -f slate-test' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://localhost:5147/health
          curl --fail http://localhost:5147/
          curl --fail -X POST -H 'Content-Type: application/json' -d '{"content":"maintenance smoke test"}' http://localhost:5147/api/notes/smoke.md
          curl --fail http://localhost:5147/api/notes/smoke.md
